site_name: Документация по Jetta VS8
site_url: https://meowkka.github.io/jetta_vs8_docs/
theme:
  name: material
  language: ru
  icon:
    annotation: material/arrow-right-circle
  favicon: images/logo.webp
  features:
    - navigation.indexes
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html  
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption

plugins:
  - glightbox
  - search
  - open-in-new-tab

nav:
  - 'О ресурсе': index.md
  - 'FAQ': faq.md